<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tenés una invitación 💌</title>

  <!-- Vista previa al compartir el link por WhatsApp: a propósito no revela nada -->
  <meta property="og:title" content="Tenés una invitación 💌" />
  <meta property="og:description" content="Tocá para abrirla. Es secreto 🤫" />
  <meta name="theme-color" content="#141230" />

  <style>
    :root {
      --bg: #141230;
      --bg-2: #221d4e;
      --card: #fffaf2;
      --ink: #2b2350;
      --ink-soft: #6b628f;
      --gold: #d4a944;
      --gold-soft: #f0d68a;
      --accent: #e5537a;
      --wa: #21b858;
      --wa-dark: #17953f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 100% at 50% 0%, var(--bg-2) 0%, var(--bg) 70%);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .serif { font-family: Georgia, "Times New Roman", serif; }

    /* ---------- Estrellitas de fondo ---------- */
    .star {
      position: fixed;
      color: var(--gold-soft);
      opacity: .5;
      animation: twinkle 3s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.8); }
      50%      { opacity: .7;  transform: scale(1.1); }
    }

    /* ---------- Escena ---------- */
    .scene {
      width: min(420px, 100%);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* ---------- Sobre cerrado ---------- */
    .envelope {
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      color: var(--gold-soft);
      -webkit-tap-highlight-color: transparent;
    }
    .envelope .flap {
      font-size: 96px;
      line-height: 1;
      display: block;
      animation: float 2.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.45));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .envelope .hint {
      margin-top: 22px;
      font-size: 15px;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .85;
    }
    .envelope .sub {
      margin-top: 8px;
      font-size: 13px;
      color: #b9b2dd;
    }

    /* ---------- Tarjeta ---------- */
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 40px 28px 34px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .5);
      display: none;
      opacity: 0;
      transform: translateY(26px) scale(.96);
      transition: opacity .6s ease, transform .6s cubic-bezier(.2, .9, .3, 1.2);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid var(--gold);
      border-radius: 12px;
      pointer-events: none;
      opacity: .55;
    }
    .scene.open .envelope { display: none; }
    .scene.open .card { display: block; }
    .scene.open .card.in { opacity: 1; transform: translateY(0) scale(1); }

    .shh {
      font-size: 44px;
      line-height: 1;
    }
    .kicker {
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    h1 {
      margin-top: 12px;
      font-size: clamp(30px, 9vw, 40px);
      font-weight: 400;
      color: var(--ink);
    }
    h1 em {
      font-style: italic;
      color: var(--gold);
    }
    .divider {
      margin: 20px auto;
      width: 70px;
      height: 1px;
      background: var(--gold);
      opacity: .6;
      position: relative;
    }
    .divider::after {
      content: "✦";
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      padding: 0 8px;
      color: var(--gold);
      font-size: 11px;
    }
    .body-text {
      font-size: 16.5px;
      line-height: 1.65;
      color: var(--ink-soft);
      max-width: 34ch;
      margin: 0 auto;
    }
    .body-text strong { color: var(--ink); }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 26px;
      background: linear-gradient(180deg, var(--wa), var(--wa-dark));
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      padding: 15px 28px;
      border-radius: 100px;
      box-shadow: 0 10px 24px rgba(23, 149, 63, .35);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .cta:active { transform: scale(.97); box-shadow: 0 5px 14px rgba(23, 149, 63, .35); }
    .cta svg { width: 22px; height: 22px; flex: none; }

    .fine-print {
      margin-top: 18px;
      font-size: 12.5px;
      color: var(--ink-soft);
      opacity: .8;
    }

    /* ---------- Confetti ---------- */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    @media (prefers-reduced-motion: reduce) {
      .envelope .flap, .star { animation: none; }
      .card { transition: opacity .3s ease; }
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <main class="scene" id="scene">

    <!-- Sobre cerrado -->
    <button class="envelope" id="openBtn" aria-label="Abrir invitación">
      <span class="flap">💌</span>
      <span class="hint serif">Tenés una invitación</span>
      <span class="sub">Tocá el sobre para abrirla</span>
    </button>

    <!-- Tarjeta -->
    <section class="card" id="card" aria-hidden="true">
      <div class="shh">🤫</div>
      <p class="kicker">Shhh… es secreto</p>
      <h1 class="serif">Fiesta sorpresa<br />para <em>Dayanne</em></h1>
      <div class="divider"></div>
      <p class="body-text">
        Se vienen sus <strong>30</strong> y lo vamos a celebrar como se merece.
        Sumate al grupo de WhatsApp para coordinar todo:
        fecha, lugar y los detalles van por ahí.
      </p>
      <a class="cta" href="https://chat.whatsapp.com/REEMPLAZAR_CON_TU_ENLACE" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.46 3.45 1.32 4.95L2.05 22l5.27-1.38a9.87 9.87 0 0 0 4.72 1.2h.01c5.46 0 9.9-4.44 9.9-9.9 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.67c2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.05-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23m-2.35 4.02c-.16 0-.43.06-.66.31-.22.25-.87.85-.87 2.07 0 1.22.89 2.4 1 2.56.13.17 1.76 2.67 4.25 3.73.59.27 1.05.42 1.41.53.59.19 1.13.16 1.56.1.48-.07 1.46-.6 1.67-1.18.2-.58.2-1.07.14-1.18-.06-.1-.23-.16-.48-.27-.25-.14-1.47-.74-1.69-.82-.23-.08-.37-.12-.56.12-.16.25-.64.81-.78.97-.15.17-.29.19-.54.07-.25-.13-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.12-.24-.01-.39.11-.5.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14 0-.3-.01-.46-.01"/></svg>
        Sumate al grupo
      </a>
      <p class="fine-print">Ni una palabra a la cumpleañera 🙊</p>
    </section>

  </main>

  <script>
    // ---------- Estrellitas ----------
    const stars = ["✦", "✧", "·", "✦", "·"];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "star";
      s.textContent = stars[i % stars.length];
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = Math.random() * 100 + "vh";
      s.style.fontSize = 8 + Math.random() * 10 + "px";
      s.style.animationDelay = Math.random() * 3 + "s";
      document.body.appendChild(s);
    }

    // ---------- Abrir sobre ----------
    const scene = document.getElementById("scene");
    const card = document.getElementById("card");
    document.getElementById("openBtn").addEventListener("click", () => {
      scene.classList.add("open");
      card.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add("in")));
      burst();
    });

    // ---------- Confetti ----------
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const COLORS = ["#e5537a", "#d4a944", "#5ec6e8", "#8f7ff0", "#67d98b", "#f0d68a"];
    let pieces = [], raf = null;

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    function burst() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      for (let i = 0; i < 120; i++) {
        pieces.push({
          x: innerWidth / 2 + (Math.random() - .5) * 80,
          y: innerHeight * 0.45,
          vx: (Math.random() - .5) * 11,
          vy: -Math.random() * 12 - 4,
          w: 5 + Math.random() * 6,
          h: 8 + Math.random() * 6,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - .5) * .3,
          color: COLORS[i % COLORS.length],
          life: 140 + Math.random() * 60,
        });
      }
      if (!raf) tick();
    }

    function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      pieces = pieces.filter(p => p.life > 0 && p.y < innerHeight + 40);
      for (const p of pieces) {
        p.vy += 0.22;           // gravedad
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life--;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, p.life / 40);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      raf = pieces.length ? requestAnimationFrame(tick) : null;
      if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  </script>
</body>
</html>
